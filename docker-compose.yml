services:
  master:
    image: leil-master:${LEILFS_VERSION:-latest}-${TAG_SUFFIX:-ubuntu-24.04}
    container_name: "leil-master"
    build:
      context: ./leil-master
      args:
        BASE_IMAGE: ${BASE_IMAGE-leil-base:ubuntu-24.04}
        LEILFS_VERSION: ${LEILFS_VERSION-}
    ports:
      - "29421:9421"
    volumes:
      - ./volumes/leil-master/etc/saunafs:/etc/saunafs/
      - ./volumes/leil-master/var/lib/saunafs/:/var/lib/saunafs/
      - ./volumes/leil-master/var/log/:/var/log/
    networks:
      - saunafsnet

  metalogger:
    image: leil-metalogger:${LEILFS_VERSION:-latest}-${TAG_SUFFIX:-ubuntu-24.04}
    container_name: "leil-metalogger"
    build:
      context: ./leil-metalogger
      args:
        BASE_IMAGE: ${BASE_IMAGE-leil-base:ubuntu-24.04}
        LEILFS_VERSION: ${LEILFS_VERSION-}
    volumes:
      - ./volumes/leil-metalogger/etc/saunafs:/etc/saunafs/
      - ./volumes/leil-metalogger/var/lib/saunafs/:/var/lib/saunafs/
      - ./volumes/leil-metalogger/var/log/:/var/log/
    depends_on:
      - master
    networks:
      - saunafsnet

  cgi:
    image: leil-cgiserver:${LEILFS_VERSION:-latest}-${TAG_SUFFIX:-ubuntu-24.04}
    container_name: "leil-cgiserver"
    build:
      context: ./leil-cgiserver
      args:
        BASE_IMAGE: ${BASE_IMAGE-leil-base:ubuntu-24.04}
        LEILFS_VERSION: ${LEILFS_VERSION-}
    ports:
      - "29425:9425"
    depends_on:
      - master
    networks:
      - saunafsnet

  chunkserver01:
    image: leil-chunkserver:${LEILFS_VERSION:-latest}-${TAG_SUFFIX:-ubuntu-24.04}
    container_name: "leil-chunkserver01"
    build:
      context: ./leil-chunkserver
      args:
        BASE_IMAGE: ${BASE_IMAGE-leil-base:ubuntu-24.04}
        LEILFS_VERSION: ${LEILFS_VERSION-}
    volumes:
      - ./volumes/leil-chunkserver01/etc/saunafs:/etc/saunafs/
      - ./volumes/leil-chunkserver01/var/log/:/var/log/
      - ./volumes/leil-chunkserver01/var/lib/saunafs:/var/lib/saunafs
      - ./volumes/leil-chunkserver01/mnt/hdd001:/mnt/hdd001
      - ./volumes/leil-chunkserver01/mnt/hdd002:/mnt/hdd002
    ports:
      - "29431:9422"
    depends_on:
      - master
    networks:
      - saunafsnet

  chunkserver02:
    image: leil-chunkserver:${LEILFS_VERSION:-latest}-${TAG_SUFFIX:-ubuntu-24.04}
    container_name: "leil-chunkserver02"
    build:
      context: ./leil-chunkserver
      args:
        BASE_IMAGE: ${BASE_IMAGE-leil-base:ubuntu-24.04}
        LEILFS_VERSION: ${LEILFS_VERSION-}
    volumes:
      - ./volumes/leil-chunkserver02/etc/saunafs:/etc/saunafs/
      - ./volumes/leil-chunkserver02/var/log/:/var/log/
      - ./volumes/leil-chunkserver02/var/lib/saunafs:/var/lib/saunafs
      - ./volumes/leil-chunkserver02/mnt/hdd001:/mnt/hdd001
      - ./volumes/leil-chunkserver02/mnt/hdd002:/mnt/hdd002
    ports:
      - "29432:9422"
    depends_on:
      - master
    networks:
      - saunafsnet

  chunkserver03:
    image: leil-chunkserver:${LEILFS_VERSION:-latest}-${TAG_SUFFIX:-ubuntu-24.04}
    container_name: "leil-chunkserver03"
    build:
      context: ./leil-chunkserver
      args:
        BASE_IMAGE: ${BASE_IMAGE-leil-base:ubuntu-24.04}
        LEILFS_VERSION: ${LEILFS_VERSION-}
    volumes:
      - ./volumes/leil-chunkserver03/etc/saunafs:/etc/saunafs/
      - ./volumes/leil-chunkserver03/var/log/:/var/log/
      - ./volumes/leil-chunkserver03/var/lib/saunafs:/var/lib/saunafs
      - ./volumes/leil-chunkserver03/mnt/hdd001:/mnt/hdd001
      - ./volumes/leil-chunkserver03/mnt/hdd002:/mnt/hdd002
      - ./volumes/leil-chunkserver03/mnt/hdd003:/mnt/hdd003
    ports:
      - "29433:9422"
    depends_on:
      - master
    networks:
      - saunafsnet

  client:
    image: leil-client:${LEILFS_VERSION:-latest}-${TAG_SUFFIX:-ubuntu-24.04}
    container_name: "leil-client"
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    build:
      context: ./leil-client
      args:
        BASE_IMAGE: ${BASE_IMAGE-leil-base:ubuntu-24.04}
        LEILFS_VERSION: ${LEILFS_VERSION-}
    command: ["/mnt/leil", "-H", "master", "-P", "9421", "-S", "/"]
    depends_on:
      - master
    volumes:
      - ./volumes/leil-client/var/log/:/var/log/
    networks:
      - saunafsnet

networks:
  saunafsnet:
    driver: bridge
