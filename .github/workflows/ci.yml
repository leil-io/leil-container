name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly run with the newest packages from LEILFS_REPOSITORY, to catch
  # upstream changes that pull requests do not see, as they are pinned to
  # LEILFS_PACKAGE_VERSION.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke test (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    env:
      TAG_SUFFIX: ubuntu-${{ matrix.ubuntu }}
      BASE_IMAGE: leil-base:ubuntu-${{ matrix.ubuntu }}
      # The images use the /etc/leil and /var/lib/leil paths that LeilFS
      # 5.13 introduced, so CI installs the newest 5.13 packages. The
      # staging repository carries release candidates as well as final
      # releases, so the images are tested before a release is cut.
      LEILFS_REPOSITORY: saunafs-ubuntu-${{ matrix.ubuntu }}-staging
      LEILFS_PACKAGE_VERSION: ${{ github.event_name != 'schedule' && '5.13.*' || '' }}
    steps:
      - uses: actions/checkout@v5

      # Docker tags cannot contain the '*' of a version pattern or the '~'
      # of a pre-release version, so the images are tagged without them.
      - name: Set the image tag version
        run: echo "LEILFS_VERSION=$(sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/[.-]+$//' <<< "$LEILFS_PACKAGE_VERSION")" >> "$GITHUB_ENV"

      - name: Build base image
        run: |
          docker build -t "$BASE_IMAGE" \
            --build-arg BASE_IMAGE=ubuntu:${{ matrix.ubuntu }} \
            --build-arg LEILFS_REPOSITORY="$LEILFS_REPOSITORY" \
            ./leil-base

      - name: Build component images
        run: |
          docker compose build --build-arg LEILFS_VERSION="$LEILFS_PACKAGE_VERSION"
          docker compose -f docker-compose.uraft.yml build --build-arg LEILFS_VERSION="$LEILFS_PACKAGE_VERSION" uraft1

      - name: Run smoke test
        run: ci/smoke-test.sh

      # Both stacks publish the same CGI port, so only one runs at a time
      - name: Stop the default cluster
        run: docker compose down

      - name: Run uRaft test
        run: ci/uraft-test.sh

      - name: Show container logs
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f docker-compose.uraft.yml logs --no-color

      - name: Collect component logs
        if: always()
        run: |
          docker compose down || true
          docker compose -f docker-compose.uraft.yml down || true
          sudo chmod -R a+rX volumes || true

      - name: Upload component logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ubuntu-${{ matrix.ubuntu }}
          path: volumes/*/var/log/
          if-no-files-found: ignore
