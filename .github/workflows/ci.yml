name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke test (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    env:
      TAG_SUFFIX: ubuntu-${{ matrix.ubuntu }}
      BASE_IMAGE: leil-base:ubuntu-${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v5

      - name: Build base image
        run: docker build -t "$BASE_IMAGE" --build-arg BASE_IMAGE=ubuntu:${{ matrix.ubuntu }} ./leil-base

      - name: Build component images
        run: docker compose build

      - name: Run smoke test
        run: ci/smoke-test.sh

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Collect component logs
        if: always()
        run: |
          docker compose down || true
          sudo chmod -R a+rX volumes || true

      - name: Upload component logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ubuntu-${{ matrix.ubuntu }}
          path: volumes/*/var/log/
          if-no-files-found: ignore
