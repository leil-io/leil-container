name: Publish

on:
  workflow_dispatch:
    inputs:
      leilfs_version:
        description: LeilFS package version, e.g. 5.12.0-1 or 5.13.0~rc1-1
        required: true
        type: string
      distro:
        description: Ubuntu version
        required: true
        type: choice
        options: ["24.04", "22.04"]
      channel:
        description: LeilFS repository channel
        required: true
        type: choice
        options: [stable, staging, experimental]
      publish:
        description: Push the images to Docker Hub when the smoke test passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Test ${{ inputs.leilfs_version }} (${{ inputs.channel }}, Ubuntu ${{ inputs.distro }})
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INPUT_VERSION: ${{ inputs.leilfs_version }}
      INPUT_DISTRO: ${{ inputs.distro }}
      INPUT_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v5

      - name: Build and run the smoke test
        run: ./publish.sh --leilfs-version "$INPUT_VERSION" --distro "$INPUT_DISTRO" --channel "$INPUT_CHANNEL" --smoke-test --no-push

      - name: Show container logs
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f docker-compose.uraft.yml logs --no-color

      - name: Collect component logs
        if: always()
        run: sudo chmod -R a+rX volumes || true

      - name: Upload component logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: volumes/*/var/log/
          if-no-files-found: ignore

  # The docker-hub environment holds the Docker Hub secrets. Its protection
  # rules (required reviewers, main branch only) are set in the repository
  # settings, so they cannot be bypassed by changing this file.
  publish:
    name: Test and publish ${{ inputs.leilfs_version }} (${{ inputs.channel }}, Ubuntu ${{ inputs.distro }})
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: docker-hub
    env:
      INPUT_VERSION: ${{ inputs.leilfs_version }}
      INPUT_DISTRO: ${{ inputs.distro }}
      INPUT_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Refuse to publish from a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publishing is only allowed from main, not ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v5

      - name: Build and run the smoke test
        run: ./publish.sh --leilfs-version "$INPUT_VERSION" --distro "$INPUT_DISTRO" --channel "$INPUT_CHANNEL" --smoke-test --no-push

      # Pushes the images built and tested by the previous step, without
      # rebuilding them.
      - name: Push to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: ./publish.sh --leilfs-version "$INPUT_VERSION" --distro "$INPUT_DISTRO" --channel "$INPUT_CHANNEL" --push-only

      - name: Show container logs
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f docker-compose.uraft.yml logs --no-color

      - name: Collect component logs
        if: always()
        run: sudo chmod -R a+rX volumes || true

      - name: Upload component logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: volumes/*/var/log/
          if-no-files-found: ignore
